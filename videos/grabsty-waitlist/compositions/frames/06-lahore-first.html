<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
        @font-face{font-family:"Bricolage Grotesque 96pt";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/BricolageGrotesque96pt-Bold.ttf") format("truetype");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 800;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-latin.woff2") format("woff2");}

        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; color: #FFFFFF; }
        .f6-bg { position: absolute; inset: 0; background-color: #0F0F0F;
          background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
          background-size: 72px 72px; }
        .f6-stage { position: absolute; inset: 0; }
        .f6-chip { position: absolute; left: 72px; top: 120px; padding: 14px 22px; border: 3px solid #FFFFFF; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; box-shadow: 8px 8px 0 #6C47FF; }
        .f6-head { position: absolute; left: 72px; top: 230px; font-family: "Bricolage Grotesque 96pt", sans-serif; font-weight: 700; font-size: 148px; line-height: 0.92; letter-spacing: -0.015em; text-transform: uppercase; text-shadow: 12px 12px 0 #6C47FF; }
        .f6-row { display: block; white-space: nowrap; }
        .f6-bag { position: absolute; left: 720px; top: 60px; width: 230px; height: auto; }

        .f6-form { position: absolute; left: 150px; top: 640px; width: 780px; height: 679px; border: 5px solid #FFFFFF; box-shadow: 18px 18px 0 #6C47FF; background: #0F0F0F; overflow: hidden; }
        .f6-form img { width: 100%; height: 100%; display: block; }
        .f6-spot { position: absolute; left: 560px; top: 590px; padding: 16px 22px; background: #FFFFFF; color: #0F0F0F; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 34px; letter-spacing: 0.06em; box-shadow: 8px 8px 0 #6C47FF; white-space: nowrap; }
        .f6-spot small { display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.16em; margin-top: 4px; }

        .f6-btn { position: absolute; left: 150px; top: 880px; width: 780px; height: 170px; background: #6C47FF; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: "Bricolage Grotesque 96pt", sans-serif; font-weight: 700; font-size: 82px; letter-spacing: -0.005em; text-transform: uppercase; color: #FFFFFF; box-shadow: 14px 14px 0 #FFFFFF; }
        .f6-ripple { position: absolute; left: 850px; top: 1000px; width: 60px; height: 60px; margin-left: -30px; margin-top: -30px; border-radius: 50%; border: 6px solid #FFFFFF; }
        .f6-cursor { position: absolute; left: 830px; top: 980px; width: 92px; height: 92px; }

        .f6-mark { position: absolute; left: 290px; top: 1150px; width: 500px; height: auto; }
        .f6-link { position: absolute; left: 72px; top: 1420px; width: 936px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 46px; letter-spacing: 0.12em; text-transform: uppercase; }
        .f6-link b { color: #6C47FF; font-weight: 800; }
      </style>

      <div data-hf-id="hf-qfrf" id="root" data-composition-id="06-lahore-first" data-width="1080" data-height="1920" data-start="0" data-duration="5">
        <div data-hf-id="hf-vwfb" id="f6-bg" class="f6-bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
        <div data-hf-id="hf-togm" id="f6-stage" class="f6-stage clip" data-start="0" data-duration="5" data-track-index="1">
          <div data-hf-id="hf-fpe2" class="f6-chip" id="f6-chip">Waitlist hub · Lahore</div>
          <div data-hf-id="hf-2dgr" class="f6-head">
            <span data-hf-id="hf-cr4v" class="f6-row" id="f6-h1">Lahore</span>
            <span data-hf-id="hf-lxsw" class="f6-row" id="f6-h2">opens first.</span>
          </div>
          <img data-hf-id="hf-mhoz" class="f6-bag" id="f6-bag" src="assets/sticker-1.png" alt="" />

          <div data-hf-id="hf-qmp4" class="f6-form" id="f6-form"><img data-hf-id="hf-uxgk" src="assets/ui-waitlist-form.png" alt="" /></div>
          <div data-hf-id="hf-7por" class="f6-btn" id="f6-btn">Join waitlist</div>
          <div data-hf-id="hf-vun8" class="f6-spot" id="f6-spot"><span data-hf-id="hf-y02s" id="f6-spot-num">#GRB-1000</span><small data-hf-id="hf-wowl">YOUR SPOT</small></div>
          <div data-hf-id="hf-2zf0" class="f6-ripple" id="f6-ripple"></div>
          <svg data-hf-id="hf-dp3h" class="f6-cursor" id="f6-cursor" viewBox="0 0 32 32" aria-hidden="true">
            <path data-hf-id="hf-fqbo" d="M6 3 L6 25 L11.5 19.8 L15.4 28.6 L19.6 26.8 L15.8 18.2 L23.4 18.2 Z" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2" stroke-linejoin="round"></path>
          </svg>

          <img data-hf-id="hf-1nyq" class="f6-mark" id="f6-mark" src="assets/logotype-white.svg" alt="Grabsty" />
          <div data-hf-id="hf-s82s" class="f6-link" id="f6-link">Link in bio · <b data-hf-id="hf-zw9w">grabsty.com</b></div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const spotEl = document.getElementById("f6-spot-num");
        const sp = { v: 1000 };

        // Scene 1 — LAHORE OPENS FIRST. + bag sticker
        tl.fromTo("#f6-chip", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0);
        tl.fromTo("#f6-h1", { opacity: 0, scale: 1.5, y: 120 }, { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "expo.out", transformOrigin: "0% 50%" }, 0.08);
        tl.fromTo("#f6-h2", { opacity: 0, x: -600 }, { opacity: 1, x: 0, duration: 0.36, ease: "expo.out" }, 0.45);
        tl.fromTo("#f6-bag", { opacity: 0, scale: 1.8, rotation: -20 }, { opacity: 1, scale: 1, rotation: 10, duration: 0.36, ease: "back.out(1.6)" }, 0.75);

        // Scene 2 — the real waitlist form rises, spot number ticks up
        tl.fromTo("#f6-form", { opacity: 0, y: 220, rotation: 0 }, { opacity: 1, y: 0, rotation: -3, duration: 0.5, ease: "expo.out" }, 1.0);
        tl.fromTo("#f6-spot", { opacity: 0, scale: 0.5, rotation: 0 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "expo.out" }, 1.35);
        tl.fromTo(sp, { v: 1000 }, { v: 1024, duration: 0.85, ease: "power3.out",
          onUpdate: () => { spotEl.textContent = "#GRB-" + Math.round(sp.v); } }, 1.4);

        // Scene 3 — form condenses into the JOIN WAITLIST button; cursor taps it
        tl.to("#f6-form", { scale: 0.3, opacity: 0, rotation: 0, duration: 0.35, ease: "power3.in" }, 2.3);
        tl.fromTo("#f6-btn", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 2.5);
        tl.fromTo("#f6-cursor", { opacity: 0, x: 300, y: 420 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power3.out" }, 2.65);
        tl.to(["#f6-btn", "#f6-cursor"], { scale: 0.92, duration: 0.08, ease: "power2.in" }, 3.12);
        tl.to(["#f6-btn", "#f6-cursor"], { scale: 1, duration: 0.25, ease: "power3.out" }, 3.2);
        tl.fromTo("#f6-ripple", { opacity: 0, scale: 0.3 }, { opacity: 0.9, scale: 1, duration: 0.08, ease: "none" }, 3.14);
        tl.to("#f6-ripple", { opacity: 0, scale: 6, duration: 0.5, ease: "power3.out" }, 3.22);

        // Scene 4 — wordmark + LINK IN BIO, then hold
        tl.fromTo("#f6-mark", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.4);
        tl.fromTo("#f6-link", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.6);

        window.__timelines["06-lahore-first"] = tl;
      </script>
    </template>
  </body>
</html>
