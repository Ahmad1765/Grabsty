<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" fill="none">
        <!-- Outer Graduated Azimuth Ring -->
        <circle cx="55" cy="55" r="48" stroke="#FFFFFF" stroke-width="1.4" opacity="0.35"></circle>
        <circle cx="55" cy="55" r="44" stroke="#6C47FF" stroke-width="1" opacity="0.5"></circle>
        <circle cx="55" cy="55" r="34" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"></circle>
        <circle cx="55" cy="55" r="22" stroke="#6C47FF" stroke-width="1.2" opacity="0.5"></circle>

        <!-- Cardinal Meridian Axis Crosshairs -->
        <line x1="55" y1="4" x2="55" y2="106" stroke="#6C47FF" stroke-width="1.5" opacity="0.6"></line>
        <line x1="4" y1="55" x2="106" y2="55" stroke="#6C47FF" stroke-width="1.5" opacity="0.6"></line>
        <line x1="19" y1="19" x2="91" y2="91" stroke="#FFFFFF" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.3"></line>
        <line x1="19" y1="91" x2="91" y2="19" stroke="#FFFFFF" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.3"></line>

        <!-- Cardinal Labels in JetBrains Mono -->
        <text x="55" y="15" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" text-anchor="middle" opacity="0.8">N</text>
        <text x="55" y="103" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" text-anchor="middle" opacity="0.6">S</text>
        <text x="98" y="58" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" text-anchor="middle" opacity="0.6">E</text>
        <text x="12" y="58" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" text-anchor="middle" opacity="0.6">W</text>

        <!-- 16-Point Compass Rose Facets -->
        <polygon points="55,18 58,45 55,55 52,45" fill="#6C47FF" opacity="0.85"></polygon>
        <polygon points="55,18 55,55 52,45" fill="#FFFFFF" opacity="0.7"></polygon>
        <polygon points="55,92 58,65 55,55 52,65" fill="#6C47FF" opacity="0.5"></polygon>
        <polygon points="92,55 65,58 55,55 65,52" fill="#6C47FF" opacity="0.5"></polygon>
        <polygon points="18,55 45,58 55,55 45,52" fill="#6C47FF" opacity="0.5"></polygon>

        <!-- Center Pivot -->
        <circle cx="55" cy="55" r="4" fill="#6C47FF"></circle>
        <circle cx="55" cy="55" r="1.5" fill="#FFFFFF"></circle>
      </svg>