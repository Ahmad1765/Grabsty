<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
        <!-- Concentric Drafting Construction Rings -->
        <circle cx="50" cy="50" r="46" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3" opacity="0.3"></circle>
        <circle cx="50" cy="50" r="38" stroke="#6C47FF" stroke-width="1" opacity="0.4"></circle>
        <circle cx="50" cy="50" r="26" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 2" opacity="0.35"></circle>
        <circle cx="50" cy="50" r="14" stroke="#6C47FF" stroke-width="1.2" opacity="0.6"></circle>

        <!-- Interlaced 8-Point Star Girih Lattice -->
        <rect x="24" y="24" width="52" height="52" stroke="#FFFFFF" stroke-width="1.4" opacity="0.4"></rect>
        <rect x="24" y="24" width="52" height="52" stroke="#6C47FF" stroke-width="1.4" transform="rotate(45 50 50)" opacity="0.6"></rect>
        <rect x="29" y="29" width="42" height="42" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" transform="rotate(22.5 50 50)" opacity="0.35"></rect>
        <rect x="29" y="29" width="42" height="42" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" transform="rotate(67.5 50 50)" opacity="0.35"></rect>

        <!-- 8 Radiating Star Points -->
        <polygon points="50,4 54,20 66,8 60,24 76,20 66,34 82,38 68,46 84,54 68,58 80,70 64,68 70,84 56,76 50,92 44,76 30,84 36,68 20,70 32,58 16,54 32,46 18,38 34,34 24,20 40,24 34,8 46,20" stroke="#6C47FF" stroke-width="1.2" fill="rgba(108, 71, 255, 0.05)" opacity="0.75"></polygon>

        <!-- Center Core Rosette -->
        <circle cx="50" cy="50" r="4" fill="#6C47FF"></circle>
        <circle cx="50" cy="50" r="1.5" fill="#FFFFFF"></circle>
      </svg>