                  <path d="M31 46 H47 V58 H31 Z" stroke="#EF4444" stroke-width="1.4" fill="var(--ink)"></path>
                  <path d="M34 44 V37 C34 34 39 34 42 37" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" fill="none"></path>
                  <line x1="33" y1="33" x2="45" y2="45" stroke="#EF4444" stroke-width="1.5"></line>
