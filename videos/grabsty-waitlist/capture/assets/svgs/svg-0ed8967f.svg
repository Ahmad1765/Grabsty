                <g transform="translate(105, 42)">
                  <rect width="78" height="154" stroke="#EF4444" stroke-width="1.8" fill="rgba(239,68,68,0.08)"></rect>
                  <rect x="0" y="0" width="78" height="22" fill="#EF4444"></rect>
                  <text x="39" y="15" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="middle">02 NO VAULT</text>
