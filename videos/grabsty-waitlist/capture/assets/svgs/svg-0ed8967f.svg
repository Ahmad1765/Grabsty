                <!-- Footer Warning Summary -->
                <line x1="18" y1="216" x2="442" y2="216" stroke="#EF4444" stroke-width="1.5" opacity="0.5"></line>
                <text x="230" y="238" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="800" letter-spacing="0.08em">ADVANCE TRANSFER • NO RETURNS • NO WAY TO GET YOUR MONEY BACK</text>
              </svg>