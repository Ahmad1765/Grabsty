<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" fill="none" class="arch-blueprint-svg arch-study-panel hidden" id="blueprint-study-02" aria-label="What You Lose Without Escrow: The Instagram and OLX Trap">
                <rect width="100%" height="100%" fill="url(#archGridPattern)"></rect>
                
                <defs>
                  <marker id="arrowFail" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
