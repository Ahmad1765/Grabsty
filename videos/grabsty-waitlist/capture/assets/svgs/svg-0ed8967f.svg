                  <text x="36" y="14" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" text-anchor="middle">01 ADVANCE</text>
                  <!-- Send money icon -->
                  <path d="M26 44 H46 M46 44 L39 37 M46 44 L39 51" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round"></path>
                  <text x="36" y="74" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" text-anchor="middle">RAAST /</text>
                  <text x="36" y="86" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" text-anchor="middle">BANK PAY</text>
                  <text x="36" y="104" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">100% Upfront</text>
                  <text x="36" y="115" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">Blind Transfer</text>
                  <rect x="6" y="123" width="60" height="9" fill="rgba(239,68,68,0.2)"></rect>
                  <text x="36" y="130" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" text-anchor="middle">IRREVERSIBLE</text>
