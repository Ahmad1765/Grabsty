                <text x="442" y="24" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end">BUYER_RISK = 100%</text>
                <line x1="18" y1="32" x2="442" y2="32" stroke="rgba(239,68,68,0.35)" stroke-dasharray="3 3" stroke-width="1"></line>

                <!-- Failure Step 01: Blind Bank Transfer -->
                <g transform="translate(18, 52)">
                  <rect width="72" height="136" stroke="rgba(239,68,68,0.5)" stroke-width="1.2" fill="rgba(15,15,15,0.85)"></rect>
