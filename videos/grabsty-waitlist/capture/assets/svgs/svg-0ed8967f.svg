                  <text x="40" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">AS-IS"</text>
                  <text x="40" y="108" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" text-anchor="middle">Zero Inspection</text>
                  <text x="40" y="119" fill="rgba(255,255,255,0.6)" font-family="'JetBrains Mono', monospace" font-size="6" text-anchor="middle">No Chargeback</text>
                  <rect x="6" y="132" width="68" height="14" fill="#EF4444"></rect>
                  <text x="40" y="142" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="900" text-anchor="middle">NO_EXCHANGE</text>
                </g>

                <!-- Connector 04 -> 05 -->
                <line x1="365" y1="120" x2="378" y2="120" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowFail)"></line>

                <!-- Failure Step 05: Total Loss -->
                <g transform="translate(380, 52)">
                  <rect width="66" height="136" stroke="#EF4444" stroke-width="1.4" fill="rgba(15,15,15,0.95)"></rect>
                  <rect x="0" y="0" width="66" height="20" fill="#EF4444"></rect>
                  <text x="33" y="14" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="900" text-anchor="middle">05 LOSS</text>
